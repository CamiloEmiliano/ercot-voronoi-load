stages:
  download_weather_tx:
    cmd: mkdir -p data/raw/weather_tx_asos && cd data/raw/weather_tx_asos && 
      ../../../.venv/bin/python ../../../scripts/weather/download_asos_weather_tx.py 
      --execute
    deps:
    - scripts/weather/download_asos_weather_tx.py
    outs:
    - data/raw/weather_tx_asos
  download_weather_nm:
    cmd: mkdir -p data/raw/weather_nm_asos && cd data/raw/weather_nm_asos && 
      ../../../.venv/bin/python ../../../scripts/weather/download_asos_weather_nm.py 
      --execute
    deps:
    - scripts/weather/download_asos_weather_nm.py
    outs:
    - data/raw/weather_nm_asos
  download_weather_ok:
    cmd: mkdir -p data/raw/weather_ok_asos && cd data/raw/weather_ok_asos && 
      ../../../.venv/bin/python ../../../scripts/weather/download_asos_weather_ok.py 
      --execute
    deps:
    - scripts/weather/download_asos_weather_ok.py
    outs:
    - data/raw/weather_ok_asos
  download_weather_ar:
    cmd: mkdir -p data/raw/weather_ar_asos && cd data/raw/weather_ar_asos && 
      ../../../.venv/bin/python ../../../scripts/weather/download_asos_weather_ar.py 
      --execute
    deps:
    - scripts/weather/download_asos_weather_ar.py
    outs:
    - data/raw/weather_ar_asos
  download_weather_la:
    cmd: mkdir -p data/raw/weather_la_asos && cd data/raw/weather_la_asos && 
      ../../../.venv/bin/python ../../../scripts/weather/download_asos_weather_la.py 
      --execute
    deps:
    - scripts/weather/download_asos_weather_la.py
    outs:
    - data/raw/weather_la_asos
  extract_ercot_map:
    cmd: cd data/interim/ercot_map && ../../../.venv/bin/python ../../../scripts/spatial/extract_ercot_map.py
    deps:
    - data/raw/ercot_map/eGRID2023_Subregions.shp
    - data/raw/ercot_map/eGRID2023_Subregions.shx
    - data/raw/ercot_map/eGRID2023_Subregions.dbf
    - data/raw/ercot_map/eGRID2023_Subregions.prj
    - scripts/spatial/extract_ercot_map.py
    outs:
    - data/interim/ercot_map/ercot_boundary.geojson
  normalize_ercot_load:
    cmd: mkdir -p data/interim/load_profile_long && .venv/bin/python scripts/load/normalize_ercot_load.py --input data/interim/ercot_backcast --output data/interim/load_profile_long --overwrite
    deps:
    - data/interim/ercot_backcast
    - scripts/load/normalize_ercot_load.py
    - src/bayes_demand_fcst/contracts.py
    outs:
    - data/interim/load_profile_long
  build_station_metadata:
    cmd: mkdir -p data/interim/station_metadata && cd data/interim/station_metadata && ../../../.venv/bin/python ../../../scripts/spatial/build_station_metadata.py
    deps:
    - data/raw/weather_tx_asos
    - data/raw/weather_nm_asos
    - data/raw/weather_ok_asos
    - data/raw/weather_ar_asos
    - data/raw/weather_la_asos
    - scripts/spatial/build_station_metadata.py
    outs:
    - data/interim/station_metadata/station_metadata.parquet
  build_weather_irregular_clean:
    cmd: .venv/bin/python scripts/weather/build_weather_irregular_clean.py --overwrite
    deps:
    - data/raw/weather_tx_asos
    - data/raw/weather_nm_asos
    - data/raw/weather_ok_asos
    - data/raw/weather_ar_asos
    - data/raw/weather_la_asos
    - scripts/weather/build_weather_irregular_clean.py
    - src/bayes_demand_fcst/contracts.py
    - src/bayes_demand_fcst/schema.py
    - src/bayes_demand_fcst/weather/__init__.py
    - src/bayes_demand_fcst/weather/clean_store.py
    - src/bayes_demand_fcst/weather/contracts.py
    - src/bayes_demand_fcst/weather/provenance.py
    outs:
    - data/interim/weather_irregular_clean
  build_weather_calibration:
    cmd: .venv/bin/python scripts/weather/build_weather_calibration.py --train-end-utc 2021-12-31T23:59:59Z --overwrite
    deps:
    - data/interim/weather_irregular_clean
    - scripts/weather/build_weather_calibration.py
    - src/bayes_demand_fcst/schema.py
    - src/bayes_demand_fcst/weather/__init__.py
    - src/bayes_demand_fcst/weather/calibration.py
    - src/bayes_demand_fcst/weather/calibration_store.py
    - src/bayes_demand_fcst/weather/causality.py
    - src/bayes_demand_fcst/weather/contracts.py
    - src/bayes_demand_fcst/weather/covariance.py
    outs:
    - data/interim/weather_calibration
  build_weather_primary_hourly:
    cmd: .venv/bin/python scripts/weather/build_weather_primary_hourly.py --mode causal --overwrite
    deps:
    - data/interim/weather_irregular_clean
    - data/interim/weather_calibration
    - data/interim/station_metadata/station_metadata.parquet
    - scripts/weather/build_weather_primary_hourly.py
    - src/bayes_demand_fcst/schema.py
    - src/bayes_demand_fcst/weather/__init__.py
    - src/bayes_demand_fcst/weather/calibration.py
    - src/bayes_demand_fcst/weather/causality.py
    - src/bayes_demand_fcst/weather/contracts.py
    - src/bayes_demand_fcst/weather/covariance.py
    - src/bayes_demand_fcst/weather/interpolation.py
    - src/bayes_demand_fcst/weather/kriging.py
    - src/bayes_demand_fcst/weather/neighborhoods.py
    - src/bayes_demand_fcst/weather/primary.py
    - src/bayes_demand_fcst/weather/primary_store.py
    - src/bayes_demand_fcst/weather/space_time.py
    outs:
    - data/interim/weather_primary_hourly
  normalize_asos_weather:
    cmd: mkdir -p data/interim/weather_station_hourly && .venv/bin/python scripts/weather/normalize_asos_weather.py --output data/interim/weather_station_hourly --overwrite
    deps:
    - data/raw/weather_tx_asos
    - data/raw/weather_nm_asos
    - data/raw/weather_ok_asos
    - data/raw/weather_ar_asos
    - data/raw/weather_la_asos
    - scripts/weather/normalize_asos_weather.py
    - src/bayes_demand_fcst/contracts.py
    outs:
    - data/interim/weather_station_hourly
  build_voronoi_weights:
    cmd: .venv/bin/python scripts/spatial/build_voronoi_weights.py --stations data/interim/station_metadata/station_metadata.parquet --boundary data/interim/ercot_map/ercot_boundary.geojson --output data/interim/voronoi_weights/voronoi_weights.parquet
    deps:
    - data/interim/station_metadata/station_metadata.parquet
    - data/interim/ercot_map/ercot_boundary.geojson
    - scripts/spatial/build_voronoi_weights.py
    outs:
    - data/interim/voronoi_weights/voronoi_weights.parquet
  aggregate_regional_weather:
    cmd: .venv/bin/python scripts/weather/aggregate_regional_weather.py --weather data/interim/weather_station_hourly --weights data/interim/voronoi_weights/voronoi_weights.parquet --output data/interim/weather_regional_hourly --overwrite
    deps:
    - data/interim/weather_station_hourly
    - data/interim/voronoi_weights/voronoi_weights.parquet
    - scripts/weather/aggregate_regional_weather.py
    outs:
    - data/interim/weather_regional_hourly
  assemble_observed_panel:
    cmd: .venv/bin/python scripts/panel/assemble_observed_panel.py --load data/interim/load_hourly --weather data/interim/weather_regional_hourly --fuel-mix data/interim/fuel_mix_hourly --output data/processed/ercot_hourly_panel --overwrite
    deps:
    - data/interim/load_hourly
    - data/interim/weather_regional_hourly
    - data/interim/fuel_mix_hourly
    - scripts/panel/assemble_observed_panel.py
    outs:
    - data/processed/ercot_hourly_panel
  download_ercot_native_load:
    cmd: .venv/bin/python scripts/load/download_ercot_native_load.py --execute
    deps:
    - scripts/load/download_ercot_native_load.py
    outs:
    - data/raw/ercot_hourly_load
  normalize_ercot_native_load:
    cmd: .venv/bin/python scripts/load/normalize_ercot_native_load.py --overwrite
    deps:
    - data/raw/ercot_hourly_load
    - scripts/load/normalize_ercot_native_load.py
    outs:
    - data/interim/load_hourly
  aggregate_fuel_mix_hourly:
    cmd: .venv/bin/python scripts/fuel_mix/aggregate_ercot_fuel_mix_hourly.py --overwrite
    deps:
    - data/interim/fuel_mix/fuel_mix_2014.parquet
    - data/interim/fuel_mix/fuel_mix_2015.parquet
    - data/interim/fuel_mix/fuel_mix_2016.parquet
    - data/interim/fuel_mix/fuel_mix_2017.parquet
    - data/interim/fuel_mix/fuel_mix_2018.parquet
    - data/interim/fuel_mix/fuel_mix_2019.parquet
    - data/interim/fuel_mix/fuel_mix_2020.parquet
    - data/interim/fuel_mix/fuel_mix_2021.parquet
    - data/interim/fuel_mix/fuel_mix_2022.parquet
    - data/interim/fuel_mix/fuel_mix_2023.parquet
    - data/interim/fuel_mix/fuel_mix_2024.parquet
    - data/interim/fuel_mix/fuel_mix_2025.parquet
    - scripts/fuel_mix/aggregate_ercot_fuel_mix_hourly.py
    outs:
    - data/interim/fuel_mix_hourly
  normalize_fuel_mix_2014:
    cmd: .venv/bin/python scripts/fuel_mix/normalize_ercot_fuel_mix_2014.py --workers 1
    deps:
    - data/raw/ercot_fuel_mix/IntGenByFuel2014.xls
    - scripts/fuel_mix/normalize_ercot_fuel_mix_2014.py
    - src/bayes_demand_fcst/qc/fuel_mix.py
    outs:
    - data/interim/fuel_mix/fuel_mix_2014.parquet
  normalize_fuel_mix_2015:
